
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>あるけみ市場価格グラフ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f2fa;
    --panel: rgba(248, 249, 250, 0.72);
    --panel-2: rgba(244, 240, 251, 0.72);
    --border: #ddd4ec;
    --text: #3d3552;
    --muted: #8b83a0;
    --accent: #7e7a7e;
    --accent-soft: rgba(155, 127, 212, 0.12);
    --accent-text: #ffffff;
  }
  * { box-sizing: border-box; font-family: inherit; }
  html {
    font-size: 82%;
  }
  html, body {
    margin: 0;
    padding: 0;
    color: var(--text);
    font-family: "Zen Kurenaido";
    line-height: 1.5;
    overflow-x: hidden;
  }
  body {
    background-image:
      linear-gradient(rgba(248, 249, 250, 0.75), rgba(248, 249, 250, 0.75)),
      url("cherry-blossom.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
  }
  .layout, .layout > *, .lower-grid, .lower-grid > * { min-width: 0; }
  .wrap {
    max-width: 1880px;
    margin: 0 auto;
    padding: 24px 32px 40px;
  }
  header h1 {
    font-size: 1rem;
    margin: 0 0 1px;
    letter-spacing: 0.02em;
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  header h1 .mark { color: var(--accent); }
  header h1 .credit {
    font-size: 0.55rem;
    font-weight: 400;
    color: var(--muted);
    letter-spacing: 0;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.7rem;
  }
  .layout {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .lower-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }
  @media (min-width: 900px) {
    .lower-grid { grid-template-columns: 1fr 1fr; align-items: start; }
  }
  .chart-sub-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
  }
  .chart-sub-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    flex: 0 0 auto;
  }
  .verdict-craft { color: #4fb0c6; font-weight: 700; }
  .verdict-buy { color: #8bc34a; font-weight: 700; }
  .verdict-even { color: var(--muted); }
  .panel {
    background: var(--panel);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 16px;
    box-shadow: 0 1px 3px rgba(155, 127, 212, 0.08);
  }
  .panel h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin: 0 0 12px;
  }
  .panel-summary {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    cursor: pointer;
    user-select: none;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .panel-summary::-webkit-details-marker { display: none; }
  .panel-summary::before {
    content: '▸';
    display: inline-block;
    font-size: 1.3em;
    transition: transform 0.15s ease;
  }
  details[open] > .panel-summary::before { transform: rotate(90deg); }
  button {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 0;
    padding: 10px 18px;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }
  .hint {
    margin-top: 10px;
    font-size: 0.72rem;
    color: var(--muted);
  }
  .chart-panel { min-height: 640px; padding: 24px; }
  .chart-panel #chartTitle { font-size: 1.2rem; }
  #chart { width: 100%; display: block; }
  .chart-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
  }
  .chart-head h2 { margin: 0; }
  .seg {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 0;
    overflow: hidden;
  }
  .seg-btn {
    background: var(--panel-2);
    color: var(--muted);
    border: none;
    border-radius: 0;
    padding: 7px 14px;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .seg-btn:hover { filter: none; color: var(--text); }
  .seg-btn.active { background: var(--accent); color: var(--accent-text); }
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  .tab {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 0;
    padding: 5px 14px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
  }
  .tab:hover { border-color: var(--accent); color: var(--text); }
  .tab.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .tab .count {
    color: var(--muted);
    font-weight: 400;
    margin-left: 5px;
    font-size: 0.75rem;
  }
  .tab.active .count { color: var(--accent); }
  .picker { margin-bottom: 14px; }
  .picker-head {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  #search {
    flex: 1;
    min-width: 0;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 8px 12px;
    font-size: 0.85rem;
  }
  #search:focus { outline: none; border-color: var(--accent); }
  button.mini {
    padding: 7px 12px;
    font-size: 0.78rem;
    border-radius: 0;
  }
  button.ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  button.ghost:hover { border-color: var(--accent); color: var(--text); filter: none; }
  .picker-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-height: 148px;
    overflow-y: auto;
    padding: 4px;
    border: 1px solid var(--border);
    border-radius: 0;
    background: var(--panel-2);
  }
  .pick {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    padding: 5px 10px;
    border-radius: 0;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .pick .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); }
  .pick.on { color: var(--text); border-color: var(--accent); }
  .pick .fav-star {
    font-size: 0.9rem;
    line-height: 1;
    color: var(--border);
    cursor: pointer;
    padding: 0 2px;
  }
  .pick .fav-star.active { color: #e0a94b; }
  .pick .fav-star:hover { color: #e0a94b; }
  .picker-empty { color: var(--muted); font-size: 0.8rem; padding: 8px; }
  .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
  td.num, th.num { text-align: right; }
  .delta-up { color: #e07a5f; font-weight: 700; }
  .delta-down { color: #4fb0c6; font-weight: 700; }
  .delta-flat { color: var(--muted); }
  .empty { color: var(--muted); font-size: 0.85rem; padding: 12px 0; }
  .tooltip {
    position: fixed;
    pointer-events: none;
    background: #3d3552;
    color: #ffffff;
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 8px 10px;
    font-size: 0.78rem;
    line-height: 1.4;
    opacity: 0;
    transition: opacity 0.08s;
    z-index: 20;
  }
  .status-line {
    color: var(--muted);
    font-size: 0.78rem;
    margin-bottom: 4px;
  }
  .status-line.err { color: #e07a5f; }
  .level-toggle-wrap { margin-top: 12px; }
  .level-toggle-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .level-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.82rem; padding: 6px 12px; border-radius: 0;
    border: 1px solid var(--border); background: var(--panel-2);
    cursor: pointer; user-select: none;
  }
  .level-toggle.is-hidden { color: var(--muted); opacity: 0.6; }
  .table-scroll { overflow-x: auto; }

// おい！　検証でここを見てるってことは博識だな！　静的で作ったからフィードバックください‼ 愛してるぞ　みるぱんち
  @media (max-width: 599px) {
    .wrap { padding: 12px 4px 20px; }
    header { padding-left: 8px !important; padding-right: 8px !important; }
    header h1 { font-size: 0.85rem; }
    header p { font-size: 0.6rem; }
    .panel { padding: 8px; }
    .chart-panel { padding: 4px; min-height: 0; }
    .panel h2 { font-size: 0.78rem; }
    .chart-head { flex-direction: column; align-items: stretch; gap: 8px; }
    .chart-head h2 { font-size: 1rem; }
    .seg { align-self: stretch; }
    .seg-btn { flex: 1; text-align: center; }
    .picker-head { flex-wrap: wrap; }
    #search { flex: 1 1 100%; }
    button.mini { flex: 1; }
    .tabs { gap: 6px; }
    .tab { padding: 5px 10px; font-size: 0.78rem; }
  th, td { padding: 5px 6px; font-size: 0.76rem; }
    .table-scroll {
      max-height: 360px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 0;
    }
    .table-scroll table { min-width: 560px; }
    .table-scroll th, .table-scroll td { white-space: nowrap; }
    .table-scroll thead th { position: sticky; top: 0; background: var(--panel); }
    .layout { gap: 12px; }
    .lower-grid { gap: 12px; }
  }
</style>
</head>
<body>
<header style="background:#f8f9fa; padding:4px 32px; position:relative; left:50%; right:50%; margin-left:-50vw; margin-right:-50vw; width:100vw; text-align:left;">
  <h1 style="color:#000000;">あるけみ市場価格グラフ</h1>
  <p id="statusLine" class="status-line" style="color:#000000;">読み込み中…</p>
  <p id="lastUpdatedLine" class="status-line" style="color:#000000;"></p>
</header>
<div class="wrap">
  <div class="layout">
    <div class="panel chart-panel">
      <div class="chart-head">
        <h2 id="chartTitle">日付ごとの価格推移</h2>
        <div class="seg" id="rangeSeg">
          <button type="button" class="seg-btn" data-days="7">7日</button>
          <button type="button" class="seg-btn" data-days="14">14日</button>
          <button type="button" class="seg-btn" data-days="30">30日</button>
          <button type="button" class="seg-btn active" data-days="0">すべて</button>
        </div>
      </div>
      <div class="tabs" id="tabs"></div>
      <div class="picker">
        <div class="picker-head">
          <input type="search" id="search" placeholder="アイテム名で検索…" autocomplete="off" />
          <button type="button" class="mini" id="selAll">全選択</button>
          <button type="button" class="mini ghost" id="selNone">全解除</button>
        </div>
        <div class="picker-list" id="pickerList"></div>
      </div>
      <canvas id="chart" width="1100" height="560"></canvas>
      <div class="level-toggle-wrap">
        <div class="chart-sub-label">表示する強化値</div>
        <div class="level-toggle-list" id="levelToggleList"></div>
      </div>
    </div>

    <div class="lower-grid">
      <div class="panel" style="grid-column: 1 / -1;">
        <details open>
          <summary class="panel-summary">お気に入り</summary>
          <p class="hint" style="margin-top:8px;">アイテム選択リストの☆でお気に入り登録すると、平均価格と現在価格を比べて買い時かどうかをここで確認できます。</p>
          <div id="favoritesWrap"></div>
        </details>
      </div>
      <div class="panel">
        <details>
          <summary class="panel-summary">お買い得情報</summary>
          <p class="hint" style="margin-top:8px;">1つ前の強化値を合成するコストと、直接購入した場合の市場価格を比較します。</p>
          <div class="chart-sub-row">
            <label style="display:flex; align-items:center; gap:6px; font-size:0.8rem; color:var(--muted); cursor:pointer;">
              <input type="checkbox" id="ladderPricingToggle" />
              価格のブレを含んで計算する
            </label>
          </div>
          <div id="craftWrap"></div>
        </details>
      </div>
      <div class="panel">
        <details>
          <summary class="panel-summary">増減</summary>
          <div id="tableWrap" style="margin-top:8px;"></div>
        </details>
      </div>
      <div class="panel" style="grid-column: 1 / -1;">
        <details>
          <summary class="panel-summary">平均価格</summary>
          <p class="hint" style="margin-top:8px;">選択中の期間・アイテムにおける、強化値ごとの平均価格です。</p>
          <div id="avgWrap"></div>
        </details>
      </div>
    </div>
  </div>
</div>
<footer style="background:#f8f9fa; padding:20px 0; position:relative; left:50%; right:50%; margin-left:-50vw; margin-right:-50vw; width:100vw; text-align:center;">
  <p class="status-line" id="dataSpanLine" style="margin:0; color:#000000;"></p>
  <p class="credit" style="margin:8px 0 0; font-size:0.7rem; color:#000000;">製作者：みるか</p>
  <p class="hint" style="margin:6px 0 0; color:#8b83a0;">※手動でデータ入力しているためばらつきがあります。ご了承ください。</p>
</footer>
<div class="tooltip" id="tooltip"></div>
<button type="button" id="scrollTopBtn" aria-label="上に戻る" style="display:none; align-items:center; justify-content:center; position:fixed; right:16px; bottom:16px; width:48px; height:48px; border-radius:50%; background:var(--accent); color:var(--accent-text); border:none; font-size:1.2rem; line-height:1; padding:0; box-shadow:0 2px 8px rgba(0,0,0,0.25); z-index:30; cursor:pointer;">▲</button>

<script>

const SUPABASE_URL = 'https://mvaepekgvzqyuettixvd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Rp-h4XEN8aK27Hx7-RKKpQ_HXNCX12G';

const PALETTE = ['#eebbcd','#4fb0c6','#e07a5f','#8bc34a','#b085f5','#f06292','#4dd0e1','#ffb74d','#9ccc65','#7986cb'];


function colorForBase(base){
  let hash = 0;
  for (let i = 0; i < base.length; i++){
    hash = (hash * 31 + base.charCodeAt(i)) | 0;
  }
  const idx = Math.abs(hash) % PALETTE.length;
  return PALETTE[idx];
}

const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  const tableWrap = document.getElementById('tableWrap');
const craftWrap = document.getElementById('craftWrap');  const tooltip = document.getElementById('tooltip');
const avgWrap = document.getElementById('avgWrap');
const favoritesWrap = document.getElementById('favoritesWrap');
let useLadderPricing = false;
document.getElementById('ladderPricingToggle').addEventListener('change', e => {
  useLadderPricing = e.target.checked;
  drawCraftTable();
});
  const tabsEl = document.getElementById('tabs');
const searchEl = document.getElementById('search');
const pickerListEl = document.getElementById('pickerList');
const chartTitleEl = document.getElementById('chartTitle');
const statusLineEl = document.getElementById('statusLine');
const lastUpdatedEl = document.getElementById('lastUpdatedLine');
const dataSpanLineEl = document.getElementById('dataSpanLine');
const levelToggleListEl = document.getElementById('levelToggleList');

const HIDDEN_LEVELS_STORAGE_KEY = 'market-hidden-levels';
const FAVORITES_STORAGE_KEY = 'market-favorites';

let store = [];
let hiddenLevels = new Set(); 
let favorites = new Set();
let allSeries = [];
let allSeriesFull = [];
let series = [];
let hidden = new Set();
let plotCache = null;
let activeCategory = '__ALL__';
let searchText = '';
let rangeDays = 0;


async function loadStoreFromSupabase(){
  try {
    const pageSize = 1000;
    let from = 0;
    let all = [];
    while (true) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/price_records?select=id,t,label,base,level,price,category&order=t.asc`, {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Range-Unit': 'items',
          'Range': `${from}-${from + pageSize - 1}`,
        },
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const rows = await res.json();
      all = all.concat(rows);
      if (rows.length < pageSize) break;
      from += pageSize;
    }
    store = all.map(r => ({
      id: String(r.id),
      t: Number(r.t),
      label: r.label,
      base: r.base,
      level: Number(r.level),
      price: Number(r.price),
      category: r.category || '未分類',
    }));
    statusLineEl.textContent = store.length ? '' : 'まだデータがありません。';
    statusLineEl.classList.remove('err');
    updateLastUpdatedLine();
    updateDataSpanLine();
  } catch (err) {
    console.error(err);
    statusLineEl.textContent = 'データの読み込みに失敗しました。時間をおいて再読み込みしてください。';
    statusLineEl.classList.add('err');
  }
}

function formatDateTime(ts){
  const d = new Date(ts);
  return `${d.getFullYear()}/${pad2(d.getMonth() + 1)}/${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

function updateLastUpdatedLine(){
  if (!store.length){ lastUpdatedEl.textContent = ''; return; }
  const maxT = Math.max(...store.map(r => r.t));
  lastUpdatedEl.textContent = `データ更新日: ${formatDateTime(maxT)}`;
}

function updateDataSpanLine(){
  if (!store.length){ dataSpanLineEl.textContent = ''; return; }
  const minT = Math.min(...store.map(r => r.t));
  const maxT = Math.max(...store.map(r => r.t));
  const days = Math.max(1, Math.ceil((maxT - minT) / 86400000) + 1);
  dataSpanLineEl.textContent = `現在 ${days} 日分のデータがあります`;
}


function loadHiddenLevelsFromLocalStorage(){
  try {
    const raw = localStorage.getItem(HIDDEN_LEVELS_STORAGE_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    hiddenLevels = new Set(Array.isArray(arr) ? arr.filter(n => Number.isFinite(n)) : []);
  } catch (err) {
    console.error(err);
    hiddenLevels = new Set();
  }
}

function saveHiddenLevelsToLocalStorage(){
  try {
    localStorage.setItem(HIDDEN_LEVELS_STORAGE_KEY, JSON.stringify([...hiddenLevels]));
  } catch (err) {
    console.error(err);
  }
}

function loadFavoritesFromLocalStorage(){
  try {
    const raw = localStorage.getItem(FAVORITES_STORAGE_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    favorites = new Set(Array.isArray(arr) ? arr : []);
  } catch (err) {
    console.error(err);
    favorites = new Set();
  }
}

function saveFavoritesToLocalStorage(){
  try {
    localStorage.setItem(FAVORITES_STORAGE_KEY, JSON.stringify([...favorites]));
  } catch (err) {
    console.error(err);
  }
}

function toggleFavorite(base){
  if (favorites.has(base)) favorites.delete(base); else favorites.add(base);
  saveFavoritesToLocalStorage();
  drawPicker();
  drawFavoritesTable();
}

function allLevelsInStore(){
  return [...new Set(store.map(r => r.level))].sort((a, b) => a - b);
}

function renderLevelToggles(){
  const levels = allLevelsInStore();
  levelToggleListEl.innerHTML = '';
  if (!levels.length){
    levelToggleListEl.innerHTML = '<div class="picker-empty">データがありません。</div>';
    return;
  }
  levels.forEach(lv => {
    const isHidden = hiddenLevels.has(lv);
    const label = document.createElement('label');
    label.className = 'level-toggle' + (isHidden ? ' is-hidden' : '');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !isHidden;
    cb.onchange = () => {
      if (cb.checked) hiddenLevels.delete(lv); else hiddenLevels.add(lv);
      saveHiddenLevelsToLocalStorage();
      render();
    };
    const span = document.createElement('span');
    span.textContent = '+' + lv;
    label.appendChild(cb);
    label.appendChild(span);
    levelToggleListEl.appendChild(label);
  });
}


function visibleStore(){
  let rows = hiddenLevels.size ? store.filter(r => !hiddenLevels.has(r.level)) : store;
  if (rangeDays > 0) {
    const cutoff = Date.now() - rangeDays * 86400000;
    rows = rows.filter(r => r.t >= cutoff);
  }
  return rows;
}

function visibleStoreForCraft(){
  return hiddenLevels.size ? store.filter(r => !hiddenLevels.has(r.level)) : store;
}

function buildCategoryMap(records){
  const map = new Map();
  for (const r of records) {
    if (!r.category || r.category === '未分類') continue;
    if (!map.has(r.base)) map.set(r.base, r.category);
  }
  return map;
}

function buildSeries(records, categoryMap){
  const groups = new Map();
  for (const r of records) {
    if (!groups.has(r.base)) groups.set(r.base, { category: r.category, hist: new Map() });
    const g = groups.get(r.base);
    if (r.category && r.category !== '未分類') g.category = r.category;
    if (!g.hist.has(r.level)) g.hist.set(r.level, []);
    g.hist.get(r.level).push({ t: r.t, price: r.price, label: r.label });
  }

  const result = [];
  for (const [base, g] of groups) {
    const history = new Map();
    for (const [level, arr] of g.hist) {
      arr.sort((a, b) => a.t - b.t);
      history.set(level, arr);
    }
    const points = [...history.entries()]
      .map(([level, arr]) => ({ level, price: arr[arr.length - 1].price }))
      .sort((a, b) => a.level - b.level);
    const resolvedCategory = (categoryMap && categoryMap.get(base)) || g.category || '未分類';
    result.push({
      base,
      category: resolvedCategory,
      color: colorForBase(base),
      points,
      history,
    });
  }
  return result;
}

function fmt(n){ return n.toLocaleString('ja-JP'); }
function pad2(n){ return String(n).padStart(2, '0'); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function render(){

  allSeries = buildSeries(visibleStore(), categoryMap);
  allSeriesFull = buildSeries(store, categoryMap);
  const cats = [...new Set(allSeries.map(s => s.category))];

}

function craftSeries(){
  const base = activeCategory === '__ALL__'
    ? allSeriesFull
    : allSeriesFull.filter(s => s.category === activeCategory);

}

function applyCategory(){
  series = activeCategory === '__ALL__'
    ? allSeries
    : allSeries.filter(s => s.category === activeCategory);
  hidden = new Set([...hidden].filter(h => series.some(s => s.base === h)));
  drawPicker();
  drawTable();
  drawAverageTable();
  drawCraftTable();

function filteredSeries(){

function drawPicker(){

function drawTabs(cats){

  cats.forEach(c => makeTab(c, c, allSeries.filter(s => s.category === c).length));

function activeSeries(){ return series.filter(s => !hidden.has(s.base)); }

function setupCanvas(){
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth || 1100;
  const cssH = cssW < 600 ? Math.max(440, Math.round(cssW * 1.5)) : 560;
  canvas.width = cssW * dpr;
  canvas.height = cssH * dpr;
  canvas.style.height = cssH + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);
  return { cssW, cssH };
}

function niceNum(range, round){
  if (!isFinite(range) || range <= 0) return 1;
  const exponent = Math.floor(Math.log10(range));
  const fraction = range / Math.pow(10, exponent);
  let niceFraction;
  if (round){
    if (fraction < 1.5) niceFraction = 1;
    else if (fraction < 3) niceFraction = 2;
    else if (fraction < 7) niceFraction = 5;
    else niceFraction = 10;
  } else {
    if (fraction <= 1) niceFraction = 1;
    else if (fraction <= 2) niceFraction = 2;
    else if (fraction <= 5) niceFraction = 5;
    else niceFraction = 10;
  }
  return niceFraction * Math.pow(10, exponent);
}

function linearTicks(maxVal, targetCount){
  if (maxVal <= 0) return { values: [0], top: 1 };
  const step = niceNum(maxVal / targetCount, true);
  const top = Math.ceil(maxVal / step) * step;
  const values = [];
  for (let v = 0; v <= top + step / 2; v += step) values.push(Math.round(v));
  return { values, top };
}

function logTicks(minVal, maxVal){
  const lo = Math.max(1, minVal);
  const hi = Math.max(lo * 1.01, maxVal);
  const startExp = Math.floor(Math.log10(lo));
  const endExp = Math.ceil(Math.log10(hi));
  const mult = [1, 2, 5];
  const vals = [];
  for (let e = startExp; e <= endExp; e++){
    for (const m of mult){
      const v = Math.round(m * Math.pow(10, e));
      if (v >= lo * 0.98 && v <= hi * 1.02) vals.push(v);
    }
  }
  const uniq = [...new Set(vals)].sort((a, b) => a - b);
  return uniq.length >= 2 ? uniq : [Math.max(1, Math.floor(lo)), Math.ceil(hi)];
}

function drawYAxis(pad, W, H, cssW, minPrice, maxPrice, useLog){
  let tickValues, yBot, yTop;
  const yVal = v => useLog ? Math.log10(Math.max(v, 1)) : v;

  if (useLog){
    tickValues = logTicks(minPrice, maxPrice * 1.1);
    yBot = yVal(tickValues[0]);
    yTop = yVal(tickValues[tickValues.length - 1]);
  } else {
    const { values, top } = linearTicks(maxPrice * 1.08, 5);
    tickValues = values;
    yBot = 0;
    yTop = top || 1;
  }

  const yOf = v => pad.t + H - ((yVal(v) - yBot) / (yTop - yBot || 1)) * H;

  ctx.strokeStyle = '#ddd4ec';
  ctx.fillStyle = '#8b83a0';
  ctx.font = '11px "Zen Kurenaido", sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  tickValues.forEach(val => {
    const y = yOf(val);
    ctx.globalAlpha = 0.7;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(cssW - pad.r, y); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillText(fmt(val), pad.l - 8, y);
  });
  return yOf;
}

function drawEmpty(cssW, cssH){
  ctx.fillStyle = '#8b83a0';
  ctx.font = '14px "Zen Kurenaido", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('データがありません。', cssW/2, cssH/2);
  plotCache = null;
}

function draw(){
  const { cssW, cssH } = setupCanvas();
  const act = activeSeries();
  if (act.length === 0){ drawEmpty(cssW, cssH); return; }
  drawDate(act, cssW, cssH);
}

  function drawMarker(ctx, x, y, color, trend){
  ctx.fillStyle = color;
  if (trend === 'flat'){
    ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI*2); ctx.fill();
    return;
  }
  const size = 6;
  ctx.beginPath();
  if (trend === 'up'){
    ctx.moveTo(x, y - size);
    ctx.lineTo(x - size * 0.8, y + size * 0.6);
    ctx.lineTo(x + size * 0.8, y + size * 0.6);
  } else {
    ctx.moveTo(x, y + size);
    ctx.lineTo(x - size * 0.8, y - size * 0.6);
    ctx.lineTo(x + size * 0.8, y - size * 0.6);
  }
  ctx.closePath();
  ctx.fill();
}

function drawDate(act, cssW, cssH){
  const useLog = false;
  const pad = { l: cssW < 600 ? 46 : 64, r: cssW < 600 ? 10 : 16, t: 16, b: 54 };
  const W = cssW - pad.l - pad.r;
  const H = cssH - pad.t - pad.b;

  let minT = Infinity, maxT = -Infinity, maxPrice = 0, minPrice = Infinity;
  const lines = [];
  act.forEach(s => {
    for (const [level, arr] of s.history){
      const pts = arr;
      pts.forEach(p => {
        minT = Math.min(minT, p.t); maxT = Math.max(maxT, p.t);
        maxPrice = Math.max(maxPrice, p.price); minPrice = Math.min(minPrice, p.price);
      });
      lines.push({ base: s.base, level, color: s.color, pts });
    }
  });
  if (!isFinite(minPrice)) minPrice = 0;
  if (!isFinite(minT)) { minT = 0; maxT = 1; }
  if (minT === maxT) { minT -= 43200000; maxT += 43200000; }

  const xOf = t => pad.l + ((t - minT) / (maxT - minT || 1)) * W;
  const yOf = drawYAxis(pad, W, H, cssW, minPrice, maxPrice, useLog);

  const span = maxT - minT;
  const DAY = 86400000;
  const intraDay = span < DAY;
  const showTime = span < DAY * 3;
  const fmtLabel = t => {
    const d = new Date(t);
    const md = `${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
    const hm = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    if (intraDay) return [hm, md];
    return showTime ? [md, hm] : [md, ''];
  };
  const xticks = cssW < 600 ? 3 : 5;

  ctx.strokeStyle = 'rgba(155,127,212,0.16)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= xticks; i++){
    const x = Math.round(pad.l + (i / xticks) * W) + 0.5;
    ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, pad.t + H); ctx.stroke();
  }

  ctx.textBaseline = 'top';
  ctx.font = '10px "Zen Kurenaido", sans-serif';
  for (let i = 0; i <= xticks; i++){
    const t = minT + (i / xticks) * span;
    ctx.textAlign = i === 0 ? 'left' : (i === xticks ? 'right' : 'center');
    const [line1, line2] = fmtLabel(t);
    ctx.fillStyle = '#3d3552';
    ctx.fillText(line1, xOf(t), pad.t + H + 7);
    if (line2){
      ctx.fillStyle = '#8b83a0';
      ctx.fillText(line2, xOf(t), pad.t + H + 20);
    }
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#8b83a0';
  ctx.fillText(intraDay ? '時刻' : '日付', pad.l + W/2, cssH - 3);

  const dashes = [[], [6,4], [2,3], [8,3,2,3], [1,3]];
  plotCache = [];
  lines.forEach(ln => {
    ctx.strokeStyle = ln.color;
    ctx.lineWidth = 2;
    ctx.setLineDash(dashes[ln.level % dashes.length]);
    ctx.beginPath();
    ln.pts.forEach((p, i) => {
      const x = xOf(p.t), y = yOf(p.price);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    ctx.setLineDash([]);
    const last = ln.pts[ln.pts.length - 1];
    ctx.fillStyle = ln.color;
    ctx.font = '10px "Zen Kurenaido", sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('+' + ln.level, xOf(last.t) + 6, yOf(last.price));
    ln.pts.forEach((p, i) => {
      const x = xOf(p.t), y = yOf(p.price);
      const prevPrice = i > 0 ? ln.pts[i - 1].price : null;
      const trend = prevPrice === null ? 'flat' : (p.price > prevPrice ? 'up' : (p.price < prevPrice ? 'down' : 'flat'));
      drawMarker(ctx, x, y, ln.color, trend);
      plotCache.push({ x, y, base: ln.base, level: ln.level, price: p.price, color: ln.color, dateLabel: p.label });
    });
  });
}

function craftAveragePriceMap(){
  let rows = store;
  if (rangeDays > 0) {
    const cutoff = Date.now() - rangeDays * 86400000;
    rows = rows.filter(r => r.t >= cutoff);
  }
  const agg = new Map();
  rows.forEach(r => {
    const key = r.base + '||' + r.level;
    if (!agg.has(key)) agg.set(key, { sum: 0, count: 0 });
    const o = agg.get(key);
    o.sum += r.price;
    o.count += 1;
  });
  const avgMap = new Map();
  for (const [key, o] of agg) avgMap.set(key, o.sum / o.count);
  return avgMap;
}

function buildCraftRows(cs){
  const rows = [];
  const avgMap = craftAveragePriceMap();
  cs.forEach(s => {
    const priceByLevel = new Map(s.points.map(p => [p.level, p.price]));
    const levels = [...priceByLevel.keys()].sort((a, b) => a - b);
    levels.forEach(lv => {
      if (hiddenLevels.has(lv)) return;
      const directPrice = priceByLevel.get(lv);
      const avgPrice = avgMap.get(s.base + '||' + lv);
      if (lv === 0) {
        const diffAvg = avgPrice === undefined ? null : avgPrice - directPrice;
        rows.push({ base: s.base, color: s.color, level: lv, fromLevel: null, qty: null, craftCost: null, directPrice, diff: null, avgPrice, diffAvg });
        return;
      }
      levels.forEach(base => {
        if (base >= lv || !priceByLevel.has(base)) return;
        const steps = lv - base;
        const qty = Math.pow(3, steps);
        const basePrice = priceByLevel.get(base);
        const craftCost = useLadderPricing
          ? qty * basePrice + Math.ceil(qty / 2)
          : basePrice * qty;
        const diff = directPrice - craftCost;
        const diffAvg = avgPrice === undefined ? null : avgPrice - craftCost;
        rows.push({ base: s.base, color: s.color, level: lv, fromLevel: base, qty, craftCost, directPrice, diff, avgPrice, diffAvg });
      });
    });
  });
  rows.sort((a, b) => a.base.localeCompare(b.base, 'ja') || a.level - b.level || (a.fromLevel ?? -1) - (b.fromLevel ?? -1));
  return rows;
}

function drawCraftTable(){
  const cs = craftSeries();
  if (cs.length === 0){ craftWrap.innerHTML = '<div class="empty">抽出できたアイテムがありません。</div>'; return; }
  const rows = buildCraftRows(cs);
  if (!rows.length){ craftWrap.innerHTML = '<div class="empty">選択中のアイテムに、比較できる価格データがありません。</div>'; return; }

  let html = '<table><thead><tr><th>アイテム</th><th style="text-align:right">強化値</th><th style="text-align:right">購入元</th><th style="text-align:right">合成コスト</th><th style="text-align:right">現在価格</th><th style="text-align:right">平均価格</th><th style="text-align:right">判定（現在比）</th><th style="text-align:right">判定（平均比）</th></tr></thead><tbody>';
  rows.forEach(r => {
    const isBase = r.fromLevel === null;
    let verdictHtml;
    if (isBase) verdictHtml = '<span class="verdict-even">合成対象外</span>';
    else if (r.diff > 0) verdictHtml = `<span class="verdict-craft">合成がお得（${fmt(r.diff)}マー節約）</span>`;
    else if (r.diff < 0) verdictHtml = `<span class="verdict-buy">直接購入がお得（${fmt(-r.diff)}マー節約）</span>`;
    else verdictHtml = '<span class="verdict-even">同額</span>';

    let verdictAvgHtml;
    if (r.diffAvg === null) verdictAvgHtml = '<span class="verdict-even">データ不足</span>';
    else if (isBase) {
      if (r.diffAvg > 0) verdictAvgHtml = `<span class="verdict-craft">今が買い時（平均より${fmt(Math.round(r.diffAvg))}マー安い）</span>`;
      else if (r.diffAvg < 0) verdictAvgHtml = `<span class="verdict-buy">今は割高（平均より${fmt(Math.round(-r.diffAvg))}マー高い）</span>`;
      else verdictAvgHtml = '<span class="verdict-even">平均並み</span>';
    } else if (r.diffAvg > 0) verdictAvgHtml = `<span class="verdict-craft">合成がお得（${fmt(Math.round(r.diffAvg))}マー節約）</span>`;
    else if (r.diffAvg < 0) verdictAvgHtml = `<span class="verdict-buy">直接購入がお得（${fmt(Math.round(-r.diffAvg))}マー節約）</span>`;
    else verdictAvgHtml = '<span class="verdict-even">同額</span>';

    html += `<tr><td><span class="swatch" style="display:inline-block;background:${r.color};vertical-align:middle;margin-right:6px;"></span>${escapeHtml(r.base)}</td>`;
    html += `<td class="num">+${r.level}</td>`;
    html += `<td class="num">${isBase ? '-' : `+${r.fromLevel}を${fmt(r.qty)}個`}</td>`;
    html += `<td class="num">${isBase ? '-' : fmt(Math.round(r.craftCost))}</td>`;
    html += `<td class="num">${fmt(r.directPrice)}</td>`;
    html += `<td class="num">${r.avgPrice === undefined ? '-' : fmt(Math.round(r.avgPrice))}</td>`;
    html += `<td class="num">${verdictHtml}</td>`;
    html += `<td class="num">${verdictAvgHtml}</td></tr>`;
  });
  html += '</tbody></table>';
  craftWrap.innerHTML = '<div class="table-scroll">' + html + '</div>';
}

function drawTable(){
  if (series.length === 0){ tableWrap.innerHTML = '<div class="empty">抽出できたアイテムがありません。</div>'; return; }
  const shown = activeSeries();
  if (shown.length === 0){ tableWrap.innerHTML = '<div class="empty">表示中のアイテムがありません。上のアイテム選択リストから選んでください。</div>'; return; }
  const showCat = activeCategory === '__ALL__';

  let rows = [];
  shown.forEach(s => {
    for (const [level, arr] of s.history) {
      arr.forEach((entry, i) => {
        const prevPrice = i > 0 ? arr[i - 1].price : null;
        const diff = prevPrice === null ? null : entry.price - prevPrice;
        rows.push({ t: entry.t, label: entry.label, base: s.base, category: s.category, color: s.color, level, price: entry.price, diff });
      });
    }
  });
  if (!rows.length){ tableWrap.innerHTML = '<div class="empty">価格の記録がまだありません。</div>'; return; }
  rows.sort((a, b) => b.t - a.t || a.base.localeCompare(b.base, 'ja') || a.level - b.level);

  let html = '<table><thead><tr><th>日付</th><th>アイテム</th>';
  if (showCat) html += '<th>カテゴリ</th>';
  html += '<th style="text-align:right">強化値</th><th style="text-align:right">価格</th><th style="text-align:right">前回比</th></tr></thead><tbody>';
  rows.forEach(r => {
    let diffHtml;
    if (r.diff === null) diffHtml = '<span class="delta-flat">初回</span>';
    else if (r.diff > 0) diffHtml = `<span class="delta-up">▲ +${fmt(r.diff)}</span>`;
    else if (r.diff < 0) diffHtml = `<span class="delta-down">▼ ${fmt(r.diff)}</span>`;
    else diffHtml = '<span class="delta-flat">±0</span>';
    html += `<tr><td>${escapeHtml(r.label)}</td><td><span class="swatch" style="display:inline-block;background:${r.color};vertical-align:middle;margin-right:6px;"></span>${escapeHtml(r.base)}</td>`;
    if (showCat) html += `<td>${escapeHtml(r.category)}</td>`;
    html += `<td class="num">+${r.level}</td><td class="num">${fmt(r.price)}</td><td class="num">${diffHtml}</td></tr>`;
  });
  html += '</tbody></table>';
  tableWrap.innerHTML = '<div class="table-scroll">' + html + '</div>';
}

function drawAverageTable(){
  if (series.length === 0){ avgWrap.innerHTML = '<div class="empty">抽出できたアイテムがありません。</div>'; return; }
  const shown = activeSeries();
  if (shown.length === 0){ avgWrap.innerHTML = '<div class="empty">表示中のアイテムがありません。上のアイテム選択リストから選んでください。</div>'; return; }
  const showCat = activeCategory === '__ALL__';

  let rows = [];
  shown.forEach(s => {
    for (const [level, arr] of s.history) {
      if (!arr.length) continue;
      const sum = arr.reduce((a, e) => a + e.price, 0);
      const avg = sum / arr.length;
      const min = Math.min(...arr.map(e => e.price));
      const max = Math.max(...arr.map(e => e.price));
      const latest = arr[arr.length - 1].price;
      rows.push({ base: s.base, category: s.category, color: s.color, level, avg, min, max, latest, count: arr.length });
    }
  });
  if (!rows.length){ avgWrap.innerHTML = '<div class="empty">価格の記録がまだありません。</div>'; return; }
  rows.sort((a, b) => a.base.localeCompare(b.base, 'ja') || a.level - b.level);

  let html = '<table><thead><tr><th>アイテム</th>';
  if (showCat) html += '<th>カテゴリ</th>';
  html += '<th style="text-align:right">強化値</th><th style="text-align:right">平均価格</th><th style="text-align:right">最安</th><th style="text-align:right">最高</th><th style="text-align:right">最新</th><th style="text-align:right">件数</th></tr></thead><tbody>';
  rows.forEach(r => {
    html += `<tr><td><span class="swatch" style="display:inline-block;background:${r.color};vertical-align:middle;margin-right:6px;"></span>${escapeHtml(r.base)}</td>`;
    if (showCat) html += `<td>${escapeHtml(r.category)}</td>`;
    html += `<td class="num">+${r.level}</td><td class="num">${fmt(Math.round(r.avg))}</td><td class="num">${fmt(r.min)}</td><td class="num">${fmt(r.max)}</td><td class="num">${fmt(r.latest)}</td><td class="num">${fmt(r.count)}</td></tr>`;
  });
  html += '</tbody></table>';
  avgWrap.innerHTML = '<div class="table-scroll">' + html + '</div>';
}

function drawFavoritesTable(){
  if (!favoritesWrap) return;
  if (!favorites.size){ favoritesWrap.innerHTML = '<div class="empty">まだお気に入りがありません。上のアイテム選択リストの☆をタップして登録してください。</div>'; return; }

  let rows = store;
  if (rangeDays > 0) {
    const cutoff = Date.now() - rangeDays * 86400000;
    rows = rows.filter(r => r.t >= cutoff);
  }
  rows = rows.filter(r => favorites.has(r.base));

  const groups = new Map();
  rows.forEach(r => {
    const key = r.base + '||' + r.level;
    if (!groups.has(key)) groups.set(key, { base: r.base, level: r.level, category: r.category, entries: [] });
    groups.get(key).entries.push(r);
  });

  const items = [...groups.values()].filter(g => g.entries.length);
  if (!items.length){ favoritesWrap.innerHTML = '<div class="empty">お気に入りアイテムの価格データが選択中の期間にありません。</div>'; return; }
  items.forEach(g => {
    g.entries.sort((a, b) => a.t - b.t);
    g.avg = g.entries.reduce((a, e) => a + e.price, 0) / g.entries.length;
    g.latest = g.entries[g.entries.length - 1].price;
    g.diff = g.avg - g.latest;
    g.color = colorForBase(g.base);
  });
  items.sort((a, b) => a.base.localeCompare(b.base, 'ja') || a.level - b.level);

  let html = '<table><thead><tr><th>アイテム</th><th style="text-align:right">強化値</th><th style="text-align:right">現在価格</th><th style="text-align:right">平均価格</th><th style="text-align:right">判定</th></tr></thead><tbody>';
  items.forEach(g => {
    let verdictHtml;
    if (g.diff > 0) verdictHtml = `<span class="verdict-craft">買い時（平均より${fmt(Math.round(g.diff))}マー安い）</span>`;
    else if (g.diff < 0) verdictHtml = `<span class="verdict-buy">割高（平均より${fmt(Math.round(-g.diff))}マー高い）</span>`;
    else verdictHtml = '<span class="verdict-even">平均並み</span>';
    html += `<tr><td><span class="swatch" style="display:inline-block;background:${g.color};vertical-align:middle;margin-right:6px;"></span>${escapeHtml(g.base)}</td>`;
    html += `<td class="num">+${g.level}</td><td class="num">${fmt(g.latest)}</td><td class="num">${fmt(Math.round(g.avg))}</td><td class="num">${verdictHtml}</td></tr>`;
  });
  html += '</tbody></table>';
  favoritesWrap.innerHTML = '<div class="table-scroll">' + html + '</div>';
}

function showTooltip(clientX, clientY, isTouch){
  if (!plotCache) { tooltip.style.opacity = 0; return; }
  const rect = canvas.getBoundingClientRect();
  const mx = clientX - rect.left, my = clientY - rect.top;
  let hit = null, best = isTouch ? 26 : 12;
  for (const p of plotCache){
    const d = Math.hypot(p.x - mx, p.y - my);
    if (d < best){ best = d; hit = p; }
  }
  if (hit){
    const dateLine = hit.dateLabel ? `<br><span style="color:#c9c2dd">${escapeHtml(hit.dateLabel)}</span>` : '';
    tooltip.innerHTML = `<b style="color:${hit.color}">${escapeHtml(hit.base)} +${hit.level}</b>${dateLine}<br>${fmt(hit.price)} マー`;
    tooltip.style.opacity = 1;
    const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
    let left = clientX + 14;
    let top = isTouch ? clientY - th - 18 : clientY + 14;
    if (left + tw > window.innerWidth - 8) left = window.innerWidth - tw - 8;
    if (left < 8) left = 8;
    if (top < 8) top = clientY + 18;
    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
  } else {
    tooltip.style.opacity = 0;
  }
}
canvas.addEventListener('mousemove', e => showTooltip(e.clientX, e.clientY, false));
canvas.addEventListener('mouseleave', () => tooltip.style.opacity = 0);
canvas.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) return;
  const t = e.touches[0];
  showTooltip(t.clientX, t.clientY, true);
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (e.touches.length !== 1) return;
  const t = e.touches[0];
  showTooltip(t.clientX, t.clientY, true);
}, { passive: true });
canvas.addEventListener('touchend', () => { setTimeout(() => tooltip.style.opacity = 0, 1200); });

window.addEventListener('resize', draw);

const scrollTopBtn = document.getElementById('scrollTopBtn');
window.addEventListener('scroll', () => {
  scrollTopBtn.style.display = window.scrollY > 300 ? 'flex' : 'none';
});
scrollTopBtn.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

const rangeSegEl = document.getElementById('rangeSeg');
rangeSegEl.addEventListener('click', e => {
  const btn = e.target.closest('.seg-btn');
  if (!btn) return;
  rangeDays = Number(btn.dataset.days);
  rangeSegEl.querySelectorAll('.seg-btn').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

searchEl.addEventListener('input', () => {
  searchText = searchEl.value;
  drawPicker();
});
document.getElementById('selAll').onclick = () => {
  filteredSeries().forEach(s => hidden.delete(s.base));
  drawPicker(); drawTable(); drawAverageTable(); drawCraftTable(); draw();
};
document.getElementById('selNone').onclick = () => {
  filteredSeries().forEach(s => hidden.add(s.base));
  drawPicker(); drawTable(); drawAverageTable(); drawCraftTable(); draw();
};

(async function init(){
  loadHiddenLevelsFromLocalStorage();
  loadFavoritesFromLocalStorage();
  await loadStoreFromSupabase();
  render();

  setInterval(async () => {
    await loadStoreFromSupabase();
    render();
  }, 5 * 60 * 1000);
})();
</script>
